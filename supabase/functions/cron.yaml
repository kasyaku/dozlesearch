functions:
  collect-playcount2-recent:
    function: collect-playcount2
    schedule: '30 21,3,9,15 * * *' # JST 6:30,12:30,18:30,0:30
    endpoint: /collect-playcount2?mode=recent

  collect-playcount2-mid:
    function: collect-playcount2
    schedule: '30 9 * * *' # JST 18:30
    endpoint: /collect-playcount2?mode=mid

  collect-playcount2-old:
    function: collect-playcount2
    schedule: '30 9 * * *' # JST 18:30
    endpoint: /collect-playcount2?mode=old